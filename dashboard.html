<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dashboard Financeiro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0b0d18;--bg2:#131625;--bg3:#1a1f35;--bg4:#222740;
  --verde:#00e676;--verm:#ff4d6a;--azul:#4d7cfe;--roxo:#9c6fe4;
  --amar:#ffd166;--ciano:#00c9c8;--laranja:#ff8c42;
  --texto:#e0e4ff;--texto2:#6b7399;--texto3:#9399c0;
  --borda:rgba(255,255,255,0.06);
}
html,body{height:100%;font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--texto);}
body{min-height:100vh;padding-bottom:60px;}

/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--borda);background:var(--bg2);position:sticky;top:0;z-index:100;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--azul),var(--roxo));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;}
.logo-text{font-size:13px;font-weight:700;line-height:1.2;}
.logo-text span{display:block;font-size:10px;font-weight:400;color:var(--texto2);}
.back{color:var(--texto2);text-decoration:none;font-size:12px;font-weight:500;padding:6px 12px;border-radius:8px;border:1px solid var(--borda);background:var(--bg3);}

/* SELETOR MES */
.mes-selector-wrap{display:flex;align-items:center;gap:8px;}
.mes-nav{background:none;border:1px solid var(--borda);color:var(--texto2);border-radius:8px;width:28px;height:28px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
.mes-nav:hover{border-color:var(--azul);color:var(--azul);}
.mes-select{background:var(--bg3);border:1px solid var(--borda);color:var(--texto);border-radius:10px;padding:5px 10px;font-size:12px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;outline:none;-webkit-appearance:none;appearance:none;text-align:center;min-width:90px;}
.mes-select:focus{border-color:var(--azul);}

/* CONTAINER */
.container{padding:16px;max-width:700px;margin:0 auto;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--borda);border-radius:16px;padding:14px 16px;}
.card-sm{background:var(--bg2);border:1px solid var(--borda);border-radius:14px;padding:12px 14px;}
.card-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:var(--texto2);margin-bottom:6px;}
.card-val{font-size:24px;font-weight:800;letter-spacing:-0.5px;}
.card-sub{font-size:10px;color:var(--texto2);margin-top:4px;}
.c-v{color:var(--verde);}.c-r{color:var(--verm);}.c-a{color:var(--azul);}.c-p{color:var(--roxo);}

.sparkline{margin-top:8px;}
svg.chart{width:100%;overflow:visible;}
.axis-lbl{font-size:8px;fill:var(--texto2);font-family:'Inter',sans-serif;}
.grid-ln{stroke:rgba(255,255,255,0.04);stroke-width:1;}

#tip{position:fixed;background:var(--bg4);border:1px solid var(--borda);border-radius:8px;padding:6px 10px;font-size:11px;pointer-events:none;display:none;z-index:999;white-space:nowrap;}

.donut-wrap{display:flex;align-items:center;gap:12px;}
.donut-legend{flex:1;min-width:0;}
.leg-row{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
.leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.leg-name{font-size:10px;color:var(--texto3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.leg-pct{font-size:10px;font-weight:600;color:var(--texto);}

.hbar-row{margin-bottom:8px;}
.hbar-top{display:flex;justify-content:space-between;margin-bottom:3px;}
.hbar-name{font-size:11px;color:var(--texto3);}
.hbar-val{font-size:11px;font-weight:600;}
.hbar-track{height:6px;background:rgba(255,255,255,0.06);border-radius:4px;overflow:hidden;}
.hbar-fill{height:100%;border-radius:4px;}

.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.pill{font-size:10px;font-weight:600;padding:4px 10px;border-radius:20px;}

.rings-wrap{display:flex;justify-content:space-around;padding:4px 0;flex-wrap:wrap;gap:8px;}
.ring-item{display:flex;flex-direction:column;align-items:center;gap:4px;}
.ring-label{font-size:9px;color:var(--texto2);text-align:center;max-width:50px;line-height:1.2;}

.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 0;gap:14px;}
.spin{width:28px;height:28px;border:2.5px solid var(--borda);border-top-color:var(--azul);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading p{font-size:13px;color:var(--texto2);}
.erro-box{background:rgba(255,77,106,0.1);border:1px solid var(--verm);border-radius:14px;padding:16px;text-align:center;font-size:13px;color:var(--verm);margin:20px 0;}
.updated{text-align:center;font-size:10px;color:var(--texto2);margin-top:14px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <div class="logo-icon">💰</div>
    <div class="logo-text">Dashboard<span>Finanças Pessoais</span></div>
  </div>

  <div class="mes-selector-wrap">
    <button class="mes-nav" id="btn-prev" onclick="mudarMes(-1)">‹</button>
    <select class="mes-select" id="mes-select" onchange="selecionarMes(this.value)"></select>
    <button class="mes-nav" id="btn-next" onclick="mudarMes(1)">›</button>
  </div>

  <a href="index.html" class="back">← Lançar</a>
</div>

<div id="tip"></div>
<div class="container">
  <div id="conteudo">
    <div class="loading"><div class="spin"></div><p>Carregando dados...</p></div>
  </div>
</div>

<script>
var APPS_URL='https://script.google.com/macros/s/AKfycbwbIJxOtGnTBpUzMuZEs5Tuo6kfxAVKcHvhaNJ6s5MRrYVL_T1cebE4djUuccyaACOzZw/exec';
var MESES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
var MESES_F=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
var CORES=['#4d7cfe','#9c6fe4','#00e676','#ffd166','#ff4d6a','#00c9c8','#ff8c42','#e040fb','#29b6f6','#66bb6a'];
var hoje=new Date();
var mesSel=hoje.getMonth(), anoSel=hoje.getFullYear();
var dadosCache=null; // cache dos dados já carregados

// Popula o select com todos os meses do ano
function popularSelect(){
  var sel=document.getElementById('mes-select');
  sel.innerHTML='';
  MESES_F.forEach(function(m,i){
    var opt=document.createElement('option');
    opt.value=i;
    opt.textContent=m+' '+anoSel;
    if(i===mesSel) opt.selected=true;
    sel.appendChild(opt);
  });
}

function selecionarMes(idx){
  mesSel=parseInt(idx);
  if(dadosCache){
    renderDashboard(dadosCache, mesSel);
  }
}

function mudarMes(dir){
  var novo=mesSel+dir;
  if(novo<0){ novo=11; }
  else if(novo>11){ novo=0; }
  mesSel=novo;
  document.getElementById('mes-select').value=mesSel;
  if(dadosCache){
    renderDashboard(dadosCache, mesSel);
  }
}

popularSelect();

function fmt(v){return 'R$ '+Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtK(v){if(v>=1000) return 'R$'+(v/1000).toFixed(0)+'k'; return 'R$'+v.toFixed(0);}

function jsonp(params,ok,err){
  var cb='cb_'+Date.now();
  var qs=Object.keys(params).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k]);}).join('&');
  var t=setTimeout(function(){cleanup(cb);err('Tempo esgotado.');},20000);
  window[cb]=function(d){clearTimeout(t);cleanup(cb);ok(d);};
  var s=document.createElement('script');s.id=cb;s.src=APPS_URL+'?'+qs+'&callback='+cb;
  s.onerror=function(){clearTimeout(t);cleanup(cb);err('Erro de conexão.');};
  document.head.appendChild(s);
}
function cleanup(cb){delete window[cb];var s=document.getElementById(cb);if(s)document.head.removeChild(s);}
function showTip(e,txt){var t=document.getElementById('tip');t.textContent=txt;t.style.display='block';t.style.left=(e.clientX+12)+'px';t.style.top=(e.clientY-30)+'px';}
function hideTip(){document.getElementById('tip').style.display='none';}

function sparkline(pts,color){
  if(!pts||pts.length<2) return '';
  var W=120,H=32,min=Math.min.apply(null,pts),max=Math.max.apply(null,pts),rng=max-min||1;
  var xs=pts.map(function(_,i){return i*(W/(pts.length-1));});
  var ys=pts.map(function(v){return H-2-Math.round((v-min)/rng*(H-4));});
  var d=xs.map(function(x,i){return (i===0?'M':'L')+x+','+ys[i];}).join(' ');
  var fill=d+' L'+xs[xs.length-1]+','+H+' L0,'+H+' Z';
  var id='sg'+Math.random().toString(36).substr(2,5);
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:32px;display:block">'
    +'<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="0%" stop-color="'+color+'" stop-opacity="0.3"/>'
    +'<stop offset="100%" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'
    +'<path d="'+fill+'" fill="url(#'+id+')"/>'
    +'<path d="'+d+'" stroke="'+color+'" stroke-width="1.5" fill="none"/>'
    +'</svg>';
}

function donutChart(items,total,r){
  r=r||44;var cx=r+4,cy=r+4,sw=r*0.38,circumf=2*Math.PI*(r-sw/2);
  var angle=-Math.PI/2,svgC='';
  items.forEach(function(it,i){
    var pct=it.valor/total,dash=(pct*circumf)+' '+(circumf*(1-pct));
    var rot=(angle/(2*Math.PI))*360;
    svgC+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(r-sw/2)+'" fill="none"'
      +' stroke="'+CORES[i%CORES.length]+'" stroke-width="'+sw+'"'
      +' stroke-dasharray="'+dash+'" stroke-dashoffset="0"'
      +' transform="rotate('+rot+' '+cx+' '+cy+')"'
      +' style="cursor:pointer" onmouseover="showTip(event,\''+it.cat+': '+fmt(it.valor)+'\')" onmouseout="hideTip()"/>';
    angle+=pct*2*Math.PI;
  });
  var sz=(r+4)*2;
  return '<svg viewBox="0 0 '+sz+' '+sz+'" style="width:96px;height:96px;flex-shrink:0">'+svgC+'</svg>';
}

function gridY(maxV,steps,W,H,pL,pR,pT,cH){
  var out='';
  for(var s=0;s<=steps;s++){
    var yp=pT+cH-Math.round(cH*(s/steps));
    out+='<line class="grid-ln" x1="'+pL+'" y1="'+yp+'" x2="'+(W-pR)+'" y2="'+yp+'"/>';
    out+='<text class="axis-lbl" x="'+(pL-4)+'" y="'+(yp+3)+'" text-anchor="end">'+fmtK(maxV*(s/steps))+'</text>';
  }
  return out;
}

function lineChart(proj, mesDest){
  var vis=[];
  var first=0;
  for(var i=0;i<proj.length;i++){if((proj[i].receita||0)>0||(proj[i].gasto||0)>0){first=i;break;}}
  for(var i=first;i<proj.length;i++) vis.push({mes:i,r:proj[i].receita||0,g:proj[i].gasto||0,real:proj[i].real});
  if(vis.length<2) return '<p style="color:var(--texto2);font-size:12px;padding:20px 0">Dados insuficientes</p>';

  var W=320,H=120,pL=36,pB=24,pT=8,pR=8,cW=W-pL-pR,cH=H-pT-pB;
  var maxV=1; vis.forEach(function(v){maxV=Math.max(maxV,v.r,v.g);});
  var sX=cW/(vis.length-1||1);
  var out=gridY(maxV,4,W,H,pL,pR,pT,cH);

  var ptsR=vis.map(function(v,i){return [pL+i*sX,pT+cH-Math.round(cH*(v.r/maxV))];});
  var ptsG=vis.map(function(v,i){return [pL+i*sX,pT+cH-Math.round(cH*(v.g/maxV))];});

  function areaPath(pts,c,id){
    var d=pts.map(function(p,i){return (i===0?'M':'L')+p[0]+','+p[1];}).join(' ');
    var fill=d+' L'+pts[pts.length-1][0]+','+(pT+cH)+' L'+pts[0][0]+','+(pT+cH)+' Z';
    return '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'
      +'<stop offset="0%" stop-color="'+c+'" stop-opacity="0.3"/>'
      +'<stop offset="100%" stop-color="'+c+'" stop-opacity="0"/></linearGradient></defs>'
      +'<path d="'+fill+'" fill="url(#'+id+')" />'
      +'<path d="'+d+'" stroke="'+c+'" stroke-width="2" fill="none"/>';
  }
  out+=areaPath(ptsR,'#4d7cfe','ag1r')+areaPath(ptsG,'#9c6fe4','ag1g');

  vis.forEach(function(v,i){
    var x=pL+i*sX;
    var yr=pT+cH-Math.round(cH*(v.r/maxV));
    var yg=pT+cH-Math.round(cH*(v.g/maxV));
    var isSel=(v.mes===mesDest);
    if(isSel){
      out+='<line x1="'+x+'" y1="'+pT+'" x2="'+x+'" y2="'+(pT+cH)+'" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="3,2"/>';
    }
    out+='<circle cx="'+x+'" cy="'+yr+'" r="'+(isSel?4:3)+'" fill="'+(v.real?'#4d7cfe':'rgba(77,124,254,0.4)')+'"'
      +' stroke="'+(isSel?'white':'none')+'" stroke-width="1.5"'
      +' onmouseover="showTip(event,\''+MESES[v.mes]+' Receita: '+fmt(v.r)+'\')" onmouseout="hideTip()" style="cursor:pointer"/>';
    out+='<circle cx="'+x+'" cy="'+yg+'" r="'+(isSel?4:3)+'" fill="'+(v.real?'#9c6fe4':'rgba(156,111,228,0.4)')+'"'
      +' stroke="'+(isSel?'white':'none')+'" stroke-width="1.5"'
      +' onmouseover="showTip(event,\''+MESES[v.mes]+' Gasto: '+fmt(v.g)+'\')" onmouseout="hideTip()" style="cursor:pointer"/>';
    out+='<text class="axis-lbl" x="'+x+'" y="'+H+'" text-anchor="middle" fill="'+(isSel?'#4d7cfe':'')+'">'+MESES[v.mes].substring(0,1)+'</text>';
  });

  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'">'+out+'</svg>'
    +'<div style="display:flex;gap:14px;margin-top:6px">'
    +'<div style="display:flex;align-items:center;gap:5px;font-size:10px;color:var(--texto2)"><div style="width:14px;height:2px;background:#4d7cfe;border-radius:2px"></div>Receitas</div>'
    +'<div style="display:flex;align-items:center;gap:5px;font-size:10px;color:var(--texto2)"><div style="width:14px;height:2px;background:#9c6fe4;border-radius:2px"></div>Despesas</div>'
    +'</div>';
}

function barChartV(items){
  var W=320,H=110,pL=36,pB=28,pT=8,pR=8,cW=W-pL-pR,cH=H-pT-pB;
  var maxV=Math.max.apply(null,items.map(function(it){return it.valor;}))||1;
  var bW=Math.max(8,Math.floor(cW/items.length)-6);
  var out=gridY(maxV,3,W,H,pL,pR,pT,cH);
  items.forEach(function(it,i){
    var bh=Math.max(3,Math.round(cH*(it.valor/maxV)));
    var bx=pL+i*(bW+6)+3,by=pT+cH-bh;
    var short=it.cat.split(':').pop().trim().substring(0,8);
    out+='<rect x="'+bx+'" y="'+by+'" width="'+bW+'" height="'+bh+'" fill="'+CORES[i%CORES.length]+'" rx="3" opacity="0.85"'
      +' onmouseover="showTip(event,\''+it.cat+': '+fmt(it.valor)+'\')" onmouseout="hideTip()" style="cursor:pointer"/>';
    out+='<text class="axis-lbl" x="'+(bx+bW/2)+'" y="'+H+'" text-anchor="middle" transform="rotate(-30,'+(bx+bW/2)+','+H+')">'+short+'</text>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'">'+out+'</svg>';
}

function gaugeRing(pct,color,label){
  var r=22,sw=6,cx=26,cy=26,circumf=2*Math.PI*(r-sw/2),filled=pct*circumf;
  return '<div class="ring-item">'
    +'<svg viewBox="0 0 52 52" style="width:52px;height:52px">'
    +'<circle cx="'+cx+'" cy="'+cy+'" r="'+(r-sw/2)+'" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="'+sw+'"/>'
    +'<circle cx="'+cx+'" cy="'+cy+'" r="'+(r-sw/2)+'" fill="none" stroke="'+color+'" stroke-width="'+sw+'"'
    +' stroke-dasharray="'+filled+' '+circumf+'" stroke-dashoffset="'+circumf/4+'" stroke-linecap="round"/>'
    +'<text x="26" y="30" text-anchor="middle" font-size="9" fill="'+color+'" font-family="Inter" font-weight="700">'+Math.round(pct*100)+'%</text>'
    +'</svg>'
    +'<div class="ring-label">'+label+'</div>'
    +'</div>';
}

function renderDashboard(d, mes){
  // Extrai dados do mês selecionado da projeção
  var proj=d.projecao||[];
  var projMes=proj[mes]||{receita:0,gasto:0,real:false};
  var receita=projMes.receita||0;
  var gasto=projMes.gasto||0;
  var resultado=receita-gasto, pos=resultado>=0;

  // Top categorias do backend (mês atual) — usa como referência visual
  var topG=d.topGastos||[];
  var topR=d.topReceitas||[];

  // Sparklines do ano
  var spkR=proj.map(function(m){return m.receita||0;});
  var spkG=proj.map(function(m){return m.gasto||0;});
  var spkSaldo=proj.map(function(m){return (m.receita||0)-(m.gasto||0);});

  // Participação anual
  var totalGastoAno=0; proj.forEach(function(m){if(m.real) totalGastoAno+=m.gasto||0;});
  var rings='';
  topG.slice(0,5).forEach(function(it,i){
    var pct=totalGastoAno>0?it.valor/totalGastoAno:0;
    var short=it.cat.split(':').pop().trim();
    rings+=gaugeRing(pct,CORES[i],short);
  });

  // Donut gastos
  var donutG='',donutLegG='';
  if(topG.length>0){
    donutG=donutChart(topG,gasto||topG.reduce(function(a,b){return a+b.valor;},0));
    topG.slice(0,4).forEach(function(it,i){
      var tot=gasto||topG.reduce(function(a,b){return a+b.valor;},0);
      var pct=tot>0?Math.round(it.valor/tot*100):0;
      donutLegG+='<div class="leg-row"><div class="leg-dot" style="background:'+CORES[i]+'"></div>'
        +'<div class="leg-name">'+it.cat.split(':').pop().trim()+'</div><div class="leg-pct">'+pct+'%</div></div>';
    });
  }

  // Donut receitas
  var donutR='',donutLegR='';
  if(topR.length>0){
    donutR=donutChart(topR,receita||topR.reduce(function(a,b){return a+b.valor;},0));
    topR.slice(0,4).forEach(function(it,i){
      var tot=receita||topR.reduce(function(a,b){return a+b.valor;},0);
      var pct=tot>0?Math.round(it.valor/tot*100):0;
      donutLegR+='<div class="leg-row"><div class="leg-dot" style="background:'+CORES[i]+'"></div>'
        +'<div class="leg-name">'+it.cat+'</div><div class="leg-pct">'+pct+'%</div></div>';
    });
  }

  // Barras horizontais
  var hbars='';
  var maxHB=topG.length>0?topG[0].valor:1;
  topG.slice(0,6).forEach(function(it,i){
    var pct=Math.round((it.valor/maxHB)*100);
    hbars+='<div class="hbar-row">'
      +'<div class="hbar-top"><span class="hbar-name">'+it.cat.split(':').pop().trim()+'</span><span class="hbar-val" style="color:'+CORES[i]+'">'+fmt(it.valor)+'</span></div>'
      +'<div class="hbar-track"><div class="hbar-fill" style="width:'+pct+'%;background:'+CORES[i]+'"></div></div>'
    +'</div>';
  });

  // Pills receitas
  var pills='';
  topR.forEach(function(it,i){
    pills+='<div class="pill" style="background:'+CORES[i]+'22;color:'+CORES[i]+';border:1px solid '+CORES[i]+'44">'+it.cat+'</div>';
  });

  var mesNome=MESES_F[mes]+' '+anoSel;
  var ehReal=projMes.real;

  document.getElementById('conteudo').innerHTML =

    // Cards topo
    '<div class="grid2">'
      +'<div class="card">'
        +'<div class="card-label">Saldo — '+mesNome+'</div>'
        +'<div class="card-val '+(pos?'c-a':'c-r')+'">'+fmt(resultado)+'</div>'
        +'<div class="card-sub">'+(pos?'▲ Superávit':'▼ Déficit')+(ehReal?'':' · projetado')+'</div>'
        +'<div class="sparkline">'+sparkline(spkSaldo,pos?'#4d7cfe':'#ff4d6a')+'</div>'
      +'</div>'
      +'<div class="card">'
        +'<div class="card-label">Despesas — '+mesNome+'</div>'
        +'<div class="card-val c-r">'+fmt(gasto)+'</div>'
        +'<div class="card-sub">Receitas: '+fmt(receita)+(ehReal?'':' · projetado')+'</div>'
        +'<div class="sparkline">'+sparkline(spkG,'#ff4d6a')+'</div>'
      +'</div>'
    +'</div>'

    // Donuts
    +'<div class="grid2" style="margin-bottom:12px">'
      +'<div class="card-sm"><div class="card-label" style="margin-bottom:8px">Despesas por Categoria</div>'
        +'<div class="donut-wrap">'+donutG+'<div class="donut-legend">'+donutLegG+'</div></div></div>'
      +'<div class="card-sm"><div class="card-label" style="margin-bottom:8px">Receitas por Categoria</div>'
        +'<div class="donut-wrap">'+donutR+'<div class="donut-legend">'+donutLegR+'</div></div></div>'
    +'</div>'

    // Linha evolução
    +'<div class="card" style="margin-bottom:12px">'
      +'<div class="card-label" style="margin-bottom:10px">Análise Mensal — Receitas e Despesas</div>'
      +lineChart(proj, mes)
    +'</div>'

    // Rings participação
    +'<div class="card" style="margin-bottom:12px">'
      +'<div class="card-label" style="margin-bottom:10px">Participação nas Despesas do Ano</div>'
      +'<div class="rings-wrap">'+rings+'</div>'
    +'</div>'

    // Barras horizontais
    +'<div class="card" style="margin-bottom:12px">'
      +'<div class="card-label" style="margin-bottom:4px">Detalhamento de Despesas</div>'
      +'<div style="font-size:10px;color:var(--texto2);margin-bottom:10px">'+mesNome+' · Total: '+fmt(gasto)+'</div>'
      +hbars
    +'</div>'

    // Barras receitas
    +'<div class="card" style="margin-bottom:12px">'
      +'<div class="card-label" style="margin-bottom:8px">Fontes de Receita — '+mesNome+'</div>'
      +'<div class="pills">'+pills+'</div>'
      +barChartV(topR)
    +'</div>'

    +'<div class="updated">Atualizado às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'</div>';
}

function renderErro(msg){
  document.getElementById('conteudo').innerHTML='<div class="erro-box">❌ '+msg+'</div>';
}

// Carrega dados uma vez e cacheia
jsonp(
  {tipo:'dashboard', data:anoSel+'-01-01'},
  function(resp){
    if(resp.ok&&resp.dados){
      dadosCache=resp.dados;
      renderDashboard(dadosCache, mesSel);
    } else {
      renderErro(resp.msg||'Erro ao carregar.');
    }
  },
  function(err){ renderErro(err); }
);
</script>
</body>
</html>
