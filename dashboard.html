<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<title>Dashboard Financeiro</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:      #0d0f1a;
    --bg2:     #151824;
    --bg3:     #1e2235;
    --verde:   #00d67e;
    --vdim:    rgba(0,214,126,0.12);
    --vbord:   rgba(0,214,126,0.3);
    --verm:    #ff4f6b;
    --rdim:    rgba(255,79,107,0.12);
    --rbord:   rgba(255,79,107,0.3);
    --azul:    #4f8fff;
    --adim:    rgba(79,143,255,0.12);
    --amar:    #ffc542;
    --texto:   #e8eaff;
    --texto2:  #6b7399;
    --borda:   rgba(255,255,255,0.06);
  }
  body { font-family:'Inter',-apple-system,sans-serif; background:var(--bg); color:var(--texto); min-height:100vh; padding:0 0 60px; }

  /* Header */
  .topbar { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--borda); }
  .back { color:var(--texto2); text-decoration:none; font-size:13px; font-weight:500; display:flex; align-items:center; gap:6px; padding:8px 14px; border-radius:10px; border:1px solid var(--borda); background:var(--bg2); }
  .topbar-title { font-size:15px; font-weight:700; }
  .mes-badge { font-size:12px; color:var(--azul); font-weight:600; background:var(--adim); padding:4px 12px; border-radius:20px; }

  .container { padding:0 16px; max-width:600px; margin:0 auto; }
  .section { margin-top:20px; }
  .section-label { font-size:11px; font-weight:700; color:var(--texto2); text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; }

  /* Cards resultado */
  .resultado-card {
    background:linear-gradient(135deg,#0f1f3a 0%,#0d1520 100%);
    border:1px solid var(--azul);
    border-radius:20px; padding:20px; margin-bottom:12px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .resultado-label { font-size:11px; font-weight:600; color:var(--texto2); text-transform:uppercase; letter-spacing:0.8px; }
  .resultado-valor { font-size:32px; font-weight:800; letter-spacing:-1px; margin-top:6px; }
  .badge { padding:5px 14px; border-radius:100px; font-size:12px; font-weight:700; }
  .badge-pos { background:var(--vdim); color:var(--verde); }
  .badge-neg { background:var(--rdim); color:var(--verm); }

  .cards2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
  .card { background:var(--bg2); border:1px solid var(--borda); border-radius:16px; padding:16px; }
  .card-label { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.6px; margin-bottom:6px; }
  .card-val { font-size:20px; font-weight:800; letter-spacing:-0.5px; }
  .card-sub { font-size:11px; color:var(--texto2); margin-top:4px; }
  .c-verde { color:var(--verde); }
  .c-verm  { color:var(--verm); }
  .c-azul  { color:var(--azul); }
  .c-amar  { color:var(--amar); }

  /* Gráfico projeção */
  .graf-card { background:var(--bg2); border:1px solid var(--borda); border-radius:20px; padding:20px 16px 12px; margin-bottom:12px; }
  .graf-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px; }
  .graf-titulo { font-size:14px; font-weight:700; }
  .graf-sub { font-size:11px; color:var(--texto2); margin-top:2px; }
  .legenda { display:flex; gap:12px; }
  .leg-item { display:flex; align-items:center; gap:5px; font-size:10px; color:var(--texto2); font-weight:600; }
  .leg-dot { width:8px; height:8px; border-radius:50%; }

  .graf-area { display:flex; align-items:flex-end; gap:4px; height:110px; padding-top:8px; }
  .bar-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; height:100%; justify-content:flex-end; }
  .bar-pair { display:flex; gap:2px; align-items:flex-end; width:100%; }
  .bar { flex:1; border-radius:3px 3px 0 0; min-height:2px; }
  .bar-r { background:var(--verde); }
  .bar-g { background:var(--verm); }
  .bar-rp { background:transparent; border:1px dashed var(--verde); border-bottom:none; }
  .bar-gp { background:transparent; border:1px dashed var(--verm); border-bottom:none; }
  .bar-mes { font-size:8px; color:var(--texto2); font-weight:700; text-transform:uppercase; margin-top:5px; }
  .bar-mes.atual { color:var(--azul); }

  /* Ranking gastos/receitas */
  .rank-card { background:var(--bg2); border:1px solid var(--borda); border-radius:20px; overflow:hidden; margin-bottom:12px; }
  .rank-header { padding:14px 16px 10px; border-bottom:1px solid var(--borda); display:flex; justify-content:space-between; align-items:center; }
  .rank-titulo { font-size:13px; font-weight:700; }
  .rank-total { font-size:12px; font-weight:600; color:var(--texto2); }
  .rank-row { padding:10px 16px; border-bottom:1px solid var(--borda); display:flex; align-items:center; gap:10px; }
  .rank-row:last-child { border-bottom:none; }
  .rank-num { font-size:11px; font-weight:700; color:var(--texto2); width:16px; text-align:center; flex-shrink:0; }
  .rank-info { flex:1; min-width:0; }
  .rank-nome { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rank-bar-wrap { flex:1; height:4px; background:var(--borda); border-radius:4px; overflow:hidden; }
  .rank-bar-fill { height:100%; border-radius:4px; }
  .rank-val { font-size:12px; font-weight:700; width:70px; text-align:right; flex-shrink:0; }

  /* Loading / Erro */
  .loading { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:80px 0; gap:14px; }
  .spin { width:28px; height:28px; border:2.5px solid var(--borda); border-top-color:var(--azul); border-radius:50%; animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .loading p { font-size:13px; color:var(--texto2); }
  .erro-box { background:var(--rdim); border:1px solid var(--rbord); border-radius:14px; padding:16px; text-align:center; font-size:13px; color:var(--verm); margin:20px 0; }
  .updated { text-align:center; font-size:11px; color:var(--texto2); margin-top:16px; }

  .divider { height:1px; background:var(--borda); margin:4px 0; }
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="back">← Lançar</a>
  <span class="topbar-title">Dashboard</span>
  <span class="mes-badge" id="mes-badge">—</span>
</div>

<div class="container">
  <div id="conteudo">
    <div class="loading"><div class="spin"></div><p>Carregando dados...</p></div>
  </div>
</div>

<script>
  var APPS_URL = 'https://script.google.com/macros/s/AKfycbwbIJxOtGnTBpUzMuZEs5Tuo6kfxAVKcHvhaNJ6s5MRrYVL_T1cebE4djUuccyaACOzZw/exec';
  var MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  var MESES_FULL = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

  var hoje     = new Date();
  var mesAtual = hoje.getMonth();
  var anoAtual = hoje.getFullYear();

  document.getElementById('mes-badge').textContent = MESES[mesAtual] + ' ' + anoAtual;

  function fmt(v) {
    return 'R$ ' + Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  }

  function jsonp(params, ok, err) {
    var cb = 'cb_' + Date.now();
    var qs = Object.keys(params).map(function(k){ return encodeURIComponent(k)+'='+encodeURIComponent(params[k]); }).join('&');
    var t  = setTimeout(function(){ cleanup(cb); err('Tempo esgotado — verifique sua conexão.'); }, 20000);
    window[cb] = function(d){ clearTimeout(t); cleanup(cb); ok(d); };
    var s = document.createElement('script');
    s.id  = cb; s.src = APPS_URL+'?'+qs+'&callback='+cb;
    s.onerror = function(){ clearTimeout(t); cleanup(cb); err('Erro de conexão com o servidor.'); };
    document.head.appendChild(s);
  }
  function cleanup(cb){ delete window[cb]; var s=document.getElementById(cb); if(s) document.head.removeChild(s); }

  function renderDashboard(d) {
    var receita  = d.receita  || 0;
    var gasto    = d.gasto    || 0;
    var resultado = receita - gasto;
    var pos      = resultado >= 0;
    var proj     = d.projecao || [];
    var topGastos   = d.topGastos   || [];
    var topReceitas = d.topReceitas || [];

    // Gráfico barras
    var maxVal = 1;
    proj.forEach(function(m){ maxVal = Math.max(maxVal, m.receita||0, m.gasto||0); });

    var barrasHTML = proj.map(function(m, i) {
      var hR = Math.round(((m.receita||0)/maxVal)*100);
      var hG = Math.round(((m.gasto||0)/maxVal)*100);
      var atual = (i === mesAtual);
      var real  = m.real;
      return '<div class="bar-col">'
        +'<div class="bar-pair">'
          +'<div class="bar '+(real?'bar-r':'bar-rp')+'" style="height:'+Math.max(hR,2)+'%"></div>'
          +'<div class="bar '+(real?'bar-g':'bar-gp')+'" style="height:'+Math.max(hG,2)+'%"></div>'
        +'</div>'
        +'<div class="bar-mes'+(atual?' atual':'')+'">'+(atual?'▾':'')+MESES[i].substring(0,1)+'</div>'
      +'</div>';
    }).join('');

    // Top gastos
    var maxG = topGastos.length > 0 ? topGastos[0].valor : 1;
    var gastosHTML = topGastos.map(function(item, i){
      var pct = Math.round((item.valor/maxG)*100);
      return '<div class="rank-row">'
        +'<div class="rank-num">'+(i+1)+'</div>'
        +'<div class="rank-info"><div class="rank-nome">'+item.cat+'</div></div>'
        +'<div class="rank-bar-wrap"><div class="rank-bar-fill" style="width:'+pct+'%;background:var(--verm)"></div></div>'
        +'<div class="rank-val c-verm">'+fmt(item.valor)+'</div>'
      +'</div>';
    }).join('');

    // Top receitas
    var maxR = topReceitas.length > 0 ? topReceitas[0].valor : 1;
    var receitasHTML = topReceitas.map(function(item, i){
      var pct = Math.round((item.valor/maxR)*100);
      return '<div class="rank-row">'
        +'<div class="rank-num">'+(i+1)+'</div>'
        +'<div class="rank-info"><div class="rank-nome">'+item.cat+'</div></div>'
        +'<div class="rank-bar-wrap"><div class="rank-bar-fill" style="width:'+pct+'%;background:var(--verde)"></div></div>'
        +'<div class="rank-val c-verde">'+fmt(item.valor)+'</div>'
      +'</div>';
    }).join('');

    document.getElementById('conteudo').innerHTML =

      // Resultado
      '<div class="section">'
      +'<div class="resultado-card">'
        +'<div>'
          +'<div class="resultado-label">Resultado — '+MESES_FULL[mesAtual]+'</div>'
          +'<div class="resultado-valor '+(pos?'c-verde':'c-verm')+'">'+fmt(resultado)+'</div>'
        +'</div>'
        +'<div class="badge '+(pos?'badge-pos':'badge-neg')+'">'+(pos?'▲ Superávit':'▼ Déficit')+'</div>'
      +'</div>'

      // Cards receita / gasto
      +'<div class="cards2">'
        +'<div class="card"><div class="card-label c-verde">Receitas</div><div class="card-val c-verde">'+fmt(receita)+'</div><div class="card-sub">mês atual</div></div>'
        +'<div class="card"><div class="card-label c-verm">Gastos</div><div class="card-val c-verm">'+fmt(gasto)+'</div><div class="card-sub">mês atual</div></div>'
      +'</div>'
      +'</div>'

      // Projeção
      +'<div class="section">'
      +'<div class="section-label">Projeção '+anoAtual+'</div>'
      +'<div class="graf-card">'
        +'<div class="graf-header">'
          +'<div><div class="graf-titulo">Receitas vs Gastos</div><div class="graf-sub">Barras tracejadas = projeção pela média</div></div>'
          +'<div class="legenda">'
            +'<div class="leg-item"><div class="leg-dot" style="background:var(--verde)"></div>Receita</div>'
            +'<div class="leg-item"><div class="leg-dot" style="background:var(--verm)"></div>Gasto</div>'
          +'</div>'
        +'</div>'
        +'<div class="graf-area">'+barrasHTML+'</div>'
      +'</div>'
      +'</div>'

      // Maiores gastos
      +'<div class="section">'
      +'<div class="section-label">Maiores gastos do mês</div>'
      +'<div class="rank-card">'
        +'<div class="rank-header"><span class="rank-titulo">Por categoria</span><span class="rank-total c-verm">'+fmt(gasto)+' total</span></div>'
        + gastosHTML
      +'</div>'
      +'</div>'

      // Maiores receitas
      +'<div class="section">'
      +'<div class="section-label">Maiores receitas do mês</div>'
      +'<div class="rank-card">'
        +'<div class="rank-header"><span class="rank-titulo">Por categoria</span><span class="rank-total c-verde">'+fmt(receita)+' total</span></div>'
        + receitasHTML
      +'</div>'
      +'</div>'

      +'<div class="updated">Atualizado às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'</div>';
  }

  function renderErro(msg) {
    document.getElementById('conteudo').innerHTML = '<div class="erro-box">❌ '+msg+'</div>';
  }

  jsonp(
    { tipo:'dashboard', data: anoAtual+'-'+String(mesAtual+1).padStart(2,'0')+'-01' },
    function(resp) {
      if (resp.ok && resp.dados) {
        renderDashboard(resp.dados);
      } else {
        renderErro(resp.msg || 'Não foi possível carregar os dados.');
      }
    },
    function(err) { renderErro(err); }
  );
</script>
</body>
</html>
